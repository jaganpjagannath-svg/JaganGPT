<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Jagangpt</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

</head>

<body>

<div class="app">

    <!-- ========================================= -->
    <!-- SIDEBAR -->
    <!-- ========================================= -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-logo">
                J
            </div>

            <div class="brand-text">

                <h2>Jagangpt</h2>

                <span>AI Assistant</span>

            </div>

        </div>


        <button
            id="newChatBtn"
            class="new-chat"
            type="button"
        >
            <span>＋</span>
            New Chat
        </button>


        <div class="history">

            <div class="history-title">
                Recent Chats
            </div>

            <div id="chatHistory"></div>

        </div>


        <div class="sidebar-footer">

            <div class="footer-logo">
                ✦
            </div>

            <div>
                <strong>Jagangpt</strong>
                <small>Powered by Gemini</small>
            </div>

        </div>

    </aside>


    <!-- ========================================= -->
    <!-- MAIN -->
    <!-- ========================================= -->

    <main class="main">

        <!-- TOPBAR -->

        <header class="topbar">

            <div class="mobile-brand">

                <div class="brand-logo">
                    J
                </div>

                <strong>Jagangpt</strong>

            </div>


            <div class="model">

                <span class="status-dot"></span>

                Gemini AI

            </div>

        </header>


        <!-- CHAT -->

        <section
            id="chatContainer"
            class="chat-container"
        >

            <!-- WELCOME -->

            <div
                id="welcome"
                class="welcome"
            >

                <div class="welcome-logo">
                    ✦
                </div>

                <h1>
                    What can I help with?
                </h1>

                <p>
                    Ask anything, build anything,
                    learn anything.
                </p>


                <div class="suggestions">

                    <button
                        class="suggestion"
                        data-text="Write a Python program for me"
                    >
                        <span>💻</span>

                        <div>
                            <strong>Write some code</strong>
                            <small>Build and debug programs</small>
                        </div>

                    </button>


                    <button
                        class="suggestion"
                        data-text="Explain a topic to me in simple words"
                    >
                        <span>🧠</span>

                        <div>
                            <strong>Explain something</strong>
                            <small>Learn difficult topics simply</small>
                        </div>

                    </button>


                    <button
                        class="suggestion"
                        data-text="Help me create a software project"
                    >
                        <span>✨</span>

                        <div>
                            <strong>Create a project</strong>
                            <small>Turn ideas into projects</small>
                        </div>

                    </button>


                    <button
                        class="suggestion"
                        data-text="Teach me Python from basics"
                    >
                        <span>📚</span>

                        <div>
                            <strong>Help me learn</strong>
                            <small>Learn step by step</small>
                        </div>

                    </button>

                </div>

            </div>

        </section>


        <!-- ===================================== -->
        <!-- INPUT -->
        <!-- ===================================== -->

        <div class="input-area">

            <div class="input-wrapper">

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Message Jagangpt..."
                    autocomplete="off"
                    spellcheck="true"
                ></textarea>


                <button
                    id="sendButton"
                    class="send-button"
                    type="button"
                    title="Send message"
                >
                    ➤
                </button>

            </div>


            <div class="input-note">

                Jagangpt can make mistakes.
                Check important information.

            </div>

        </div>

    </main>

</div>


<script
    src="{{ url_for('static', filename='script.js') }}"
></script>

</body>

</html>
